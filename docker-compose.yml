# Backend stack — INDEPENDENT lifecycle. Always published on host port 8000.
#
# Infra (Postgres / Redis / MinIO) lives in docker-compose.infra.yml and must
# be up first (scripts/up-infra.ps1). This stack connects to it over the shared
# external network `cashing-net` — so `scripts/restart-backend.ps1` restarts
# ONLY the backend and never touches the database.
#
# The source tree is bind-mounted (`.:/app`) and Dockerfile.dev runs
# uvicorn --reload, so local code edits are picked up without a rebuild.
name: cashing-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Backend is ALWAYS on 8000 (host) -> 8000 (container).
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # `db` / `minio` resolve over the shared `cashing-net` network to the
      # independent infra stack (docker-compose.infra.yml).
      DATABASE_URL: postgresql+asyncpg://cashin:cashin_local@db:5432/cashin?sslmode=disable
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - .:/app
    networks:
      default:
        aliases: [app]

# Shared external network (created by scripts/up-infra.ps1). The infra stack
# owns its lifecycle; this stack only joins it.
networks:
  default:
    name: cashing-net
    external: true
