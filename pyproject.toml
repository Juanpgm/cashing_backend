[project]
name = "cashin-backend"
version = "0.1.0"
description = "AI Agent-first backend for automating Colombian contractor billing (cuentas de cobro)"
requires-python = ">=3.12"
readme = "README.md"
# SINGLE SOURCE OF TRUTH for dependencies. Edit versions HERE only.
# requirements.txt / requirements-dev.txt are GENERATED from this file + uv.lock
# via `make lock` (uv export) — never hand-edit them. See the [dependency-groups]
# and [tool.uv] sections below.
dependencies = [
    # Core
    "fastapi>=0.138,<0.139",  # 0.138+ needed for mcp>=1.28 (starlette>=0.48); older caps starlette<0.47
    "uvicorn[standard]>=0.49,<0.50",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    # Auth
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0,<4.1",
    "firebase-admin>=7.4.0",
    # Agent
    "litellm>=1.60,<2",
    "tenacity>=9,<10",
    # MCP (Model Context Protocol) — curated tool server, see app/mcp/server.py
    "mcp>=1.28,<2",
    # Document Processing
    "python-docx>=1.1,<2",
    "pdfplumber>=0.11,<1",
    "pymupdf>=1.24,<2",  # rasterizes scanned PDFs to images for local vision models (pure wheel, no system deps)
    "pytesseract>=0.3.10,<1",  # local OCR tier option A: needs the Tesseract binary + 'spa' language data installed
    "rapidocr-onnxruntime>=1.4,<2",  # local OCR tier option B: pip-only, no system binary
    "rarfile>=4.2,<5",  # .rar evidence archives; needs an unrar/bsdtar binary at runtime (degrades gracefully without it)
    "opencv-python-headless>=4.8,<5",  # required by rapidocr-onnxruntime
    "onnxruntime>=1.18,<2",  # required by rapidocr-onnxruntime
    "pyclipper>=1.3,<2",  # required by rapidocr-onnxruntime
    "shapely>=2.0,<3",  # required by rapidocr-onnxruntime
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.18,<1",
    # PDF Generation
    "jinja2>=3.1,<4",
    "weasyprint>=63,<64",
    "pyhanko>=0.35,<0.36",  # requires cryptography>=47
    # Google Workspace
    "google-api-python-client>=2.160,<3",
    "google-auth>=2.38,<3",
    "google-auth-oauthlib>=1.2,<2",
    # Storage (S3-compatible)
    "boto3>=1.36,<2",
    # Payments / HTTP
    "httpx>=0.28,<1",
    # Security
    "cryptography>=49,<50",  # floor bumped for pyhanko>=0.35
    "detect-secrets>=1.5,<2",  # runtime secret scan for the evidence packager (billing-resilience-templates)
    "idna>=3.18",  # explicit floor (transitive via requests/httpx) for the security advisory
    # Rate Limiting
    "slowapi>=0.1,<1",
    # Logging
    "structlog>=24,<25",
    # File Validation
    "python-magic>=0.4,<1",
    # Utils
    "num2words>=0.5,<1",  # spell out contract amounts in Spanish (valor en letras)
    "orjson>=3,<4",
    "python-dotenv>=1,<2",
]

[dependency-groups]
# Dev/test/lint/security tooling. Installed by `uv sync` and exported into
# requirements-dev.txt. httpx and detect-secrets are runtime deps (above), not repeated here.
dev = [
    # Testing
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "coverage[toml]>=7,<8",
    "moto[s3]>=5,<6",
    "factory-boy>=3,<4",
    "aiosqlite>=0.20,<1",
    # Linting & Typing
    "ruff>=0.9,<1",
    "mypy>=1.15,<2",
    # Security Scanning
    "bandit>=1.8,<2",
    "pip-audit>=2,<3",
    "safety>=3,<4",
    "pre-commit>=4,<5",
]

[tool.uv]
# This is an application, not a distributable library — do not build/install the
# project itself into the venv, only manage its dependencies.
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert used (ok in tests)
    "S104",  # hardcoded-bind-all-interfaces (ok in dev config)
    "S105",  # hardcoded passwords (dev defaults, overridden by env vars)
    "B008",  # Depends() in args (standard FastAPI pattern)
    "UP042", # str+Enum (needed for Pydantic/SQLAlchemy serialization compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"app/api/v1/debug.py" = ["E501"]  # HTML/JS/CSS embedded strings legitimately exceed line length

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "weasyprint.*",
    "pdfplumber.*",
    "fitz.*",
    "pytesseract.*",
    "PIL.*",
    "rapidocr_onnxruntime.*",
    "numpy.*",
    "docx.*",
    "openpyxl.*",
    "moto.*",
    "slowapi.*",
    "magic.*",
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live_llm: hits a real local Ollama server (opt-in: -m live_llm)",
    "live: hits a real external network API (opt-in: -m live), e.g. datos.gov.co Socrata",
]
addopts = "-m \"not live_llm and not live\""

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
